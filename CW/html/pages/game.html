<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" href="../../assets/elements/aisle_nine_emoji.png">
        <title>Game Page</title>
        <link rel="stylesheet" href="../../CSS/styles.css">

        <script src="../../javascript/level_select.js" defer></script>
        <script src="../../javascript/levels.js" defer></script>
        <script src="../../javascript/game.js" defer></script>
    </head>

    <body>
        <p id="successfullForm" hidden></p>
        <header>
            <div>
                <img id="logo" src="../../assets/elements/aisle_nine_logo.png" alt="Aisle Nine Logo">
            </div>
            <nav>
                <div class="page">
                    <a class="page_style" href="../index.html">
                        <img class="page_icon" src="../../assets/page_buttons/button_background.png" alt="Home Icon">
                        <span class="page_button_text">Home</span>
                    </a>
                
                </div>
                <div class="page">
                    <a class="page_style" href="login.html">
                        <img class="page_icon" src="../../assets/page_buttons/button_background.png" alt="Login Icon">
                        <span class="page_button_text">Login</span>
                    </a>
                </div>
                <div class="page">
                    <a class="page_style" href="register.html">
                        <img class="page_icon" src="../../assets/page_buttons/button_background.png" alt="Register Icon">
                        <span class="page_button_text">Register</span>
                    </a>
                </div>
                <div class="current_page">
                    <a id="current_page_style" href="game.html">
                        <img class="page_icon" src="../../assets/page_buttons/current_button_background.png" alt="Game Icon">
                        <span class="page_button_text">Game</span>
                    </a>
                </div>
                <div class="page">
                    <a class="page" href="leaderboard.html">
                        <img class="page_icon" src="../../assets/page_buttons/button_background.png" alt="Leaderboard Icon">
                        <span id="page_button_text_leaderboard">Leaderboard</span>
                    </a>
                </div>
            </nav>
        </header>

        <div id="divider">
        </div>

        <div id="belt">
            <video id="belt_video" autoplay muted loop playsinline aria-hidden="true">
                <source src="../../assets/belt_loop_slow_brown.mp4" type="video/mp4">
            </video>

            <div class="belt_text">
                <span class="belt_text_blur">Move!</span>
                <span class="belt_text_blur">Pick Up!</span>
                <span class="belt_text_blur">Avoid!</span>
                <span class="belt_text_blur">Unlock!</span>
                <span class="belt_text_blur">Finish!</span>
                <span class="belt_text_blur">Fast!</span>
            </div>
        </div>

        <div id="divider">
        </div>


        <div id="mainContentGame">
            <div id="levelSelect"> 
                <img id="levelSelectCharacter" src="../../assets/characters/game_level_select_character.png" alt="Level Select Frame">

                <img id="levelSelectNotepad" src="../../assets/game/level_select/game_notepad.png" alt="Level Select Notepad">

                <button id="buttonLevel1" class="level" data-level="1">
                    <img id="barCodeLevel1" src="../../assets/game/level_select/barcode_level_1.png" alt="Level 1 Bar Code">
                    <span id="textLevel1">1</span>
                </button>

                <button id="buttonLevel5" class="level" data-level="5">
                    <img id="barCodeLevel5" src="../../assets/game/level_select/barcode_level_5.png" alt="Level 5 Bar Code">
                    <span id="textLevel5">5</span>
                </button>


                <button id="buttonLevel2" class="level" data-level="2">
                    <img id="barCodeLevel2" src="../../assets/game/level_select/barcode_level_1.png" alt="Level 1 Bar Code">
                    <span id="textLevel5">2</span>
                </button>
                <button id="buttonLevel3" class="level" data-level="3">
                    <img id="barCodeLevel3" src="../../assets/game/level_select/barcode_level_1.png" alt="Level 1 Bar Code">
                    <span id="textLevel5">3</span>
                </button>
                <button id="buttonLevel4" class="level" data-level="4">
                    <img id="barCodeLevel4" src="../../assets/game/level_select/barcode_level_1.png" alt="Level 1 Bar Code">
                    <span id="textLevel5">4</span>
                </button>

                
            </div>

            <div id="levelScreen" hidden>
                <canvas id="game_canvas" width="750" height="750">
                </canvas>

                <button id="backToLevelSelect">
                    <img id="backToLevelSelectImage" src="../../assets/game/back_to_level_select_button.png" alt="Back to Level Select Button">
                </button>

                <button id="retryLevel">
                    <img id="retryLevelImage" src="../../assets/game/retry_level_button.png" alt="Retry Level Button">
                </button>

                <div id="listedGroceries">
                    <img id="listedGroceriesImage" src="../../assets/game/listed_groceries.png">
                    <p id="currentListedGroceries"></p>
                </div>

                <div id="timer">
                    <img id="timerImage" src="../../assets/game/timer.png" alt="Timer">
                    <p id="time"></p>
                </div>

                <div id="inventory">
                    <img id="inventoryImage" src="../../assets/game/inventory.png" alt="Inventory Image">
                    <p id="inventoryItems"></p>
                </div>

            </div>
        </div> 
        

        <footer id="footer">
            <p id="footer_social_media_text">
            Check out our social media:
            </p>
            
            <a href="https://www.instagram.com" target="_blank">
                <img class="footer_social_media" src="../../assets/footer_icons/instagram.png" alt="Footer Instagram Icon">
            </a>
            <a href="https://www.youtube.com" target="_blank">
                <img class="footer_social_media" src="../../assets/footer_icons/youtube.png" alt="Footer Youtube Icon">
            </a>
            <a href="https://www.facebook.com" target="_blank">
                <img class="footer_social_media" src="../../assets/footer_icons/facebook.png" alt="Footer Facebook Icon">
            </a>
            <a href="https://www.tiktok.com" target="_blank">
                <img class="footer_social_media" src="../../assets/footer_icons/tiktok.png" alt="Footer Tiktok Icon">
            </a>
            <a href="https://twitter.com" target="_blank">
                <img class="footer_social_media" src="../../assets/footer_icons/X.png" alt="Footer X Icon">
            </a>

            <p id="footer_text">
                © 2026 Aisle Nine. Created by Stepan Pelc. All rights reserved.
            </p>

            <div id="footer_email">
                <p>
                    Contact Us: <span id="footer_email_link">info@aislenine.com</span>
                </p>
                <a href="mailto:info@aislenine.com">
                    <img id="footer_email_icon" src="../../assets/footer_icons/email.png" alt="Footer Email Icon">
                </a>
            </div>

        </footer>
    </body>
    
</html>
