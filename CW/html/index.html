<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" href="../assets/elements/aisle_nine_emoji.png">
        <title>Home Page</title>
        
        <link rel="stylesheet" href="../CSS/styles.css">

        <script src="../javascript/sessionStorage.js" defer></script>
    </head>

    <body>
        <header>
            <div>
                <img id="logo" src="../assets/elements/aisle_nine_logo.png" alt="Aisle Nine Logo">
            </div>

            <nav>
                <div class="currentPage">
                    <a id="currentPageStyle" href="index.html">
                        <img class="pageIcon" src="../assets/page_buttons/current_button_background.png" alt="Home Icon">
                        <span class="pageButtonText">Home</span>
                    </a>
                
                </div>
                <div class="page">
                    <a class="page" href="pages/login.html">
                        <img class="pageIcon" src="../assets/page_buttons/button_background.png" alt="Login Icon">
                        <span class="pageButtonText">Login</span>
                    </a>
                </div>
                <div class="page">
                    <a class="page" href="pages/register.html">
                        <img class="pageIcon" src="../assets/page_buttons/button_background.png" alt="Register Icon">
                        <span class="pageButtonText">Register</span>
                    </a>
                </div>
                <div class="page">
                    <a class="page" href="pages/game.html">
                        <img class="pageIcon" src="../assets/page_buttons/button_background.png" alt="Game Icon">
                        <span class="pageButtonText">Game</span>
                    </a>
                </div>
                <div class="page">
                    <a class="page" href="pages/leaderboard.html">
                        <img class="pageIcon" src="../assets/page_buttons/button_background.png" alt="Leaderboard Icon">
                        <span id="pageButtonTextLeaderboard">Leaderboard</span>
                    </a>
                </div>
                <div id="userIcon">
                    <img id="userIconImage" src="../assets/user_icon.png" alt="User Icon">
                    <a id="usernameIcon" href="./pages/login.html">Log in</a>
                    <button hidden id="usernameIconLogged" onclick="logoutUser()"></button>
                </div>
            </nav>  
        </header>

        <div id="divider">
        </div>

        <div id="belt">
            <video id="beltVideo" autoplay muted loop playsinline aria-hidden="true">
                <source src="../assets/belt_loop_slow_brown.mp4" type="video/mp4">
            </video>

            <div class="beltText">
                <span class="beltTextBlur">Move!</span>
                <span class="beltTextBlur">Pick Up!</span>
                <span class="beltTextBlur">Avoid!</span>
                <span class="beltTextBlur">Unlock!</span>
                <span class="beltTextBlur">Finish!</span>
                <span class="beltTextBlur">Fast!</span>
            </div>
        </div>

        <div id="divider">
        </div>


        <div id="mainContentHome">
            <h1 id="mainContentTitle">Welcome to Aisle Nine!</h1>
            <p>
                <img id="homeInstructions" src="../assets/elements/home_page_instructions.png" alt="Content Instructions">
                <img id="homeCharacter" src="../assets/characters/home_page_character.png" alt="Content Character">
            </p>


        </div>
        

        <footer id="footer">
            <p id="footer_social_media_text">
            Check out our social media:
            </p>
            
            <a href="https://www.instagram.com" target="_blank">
                <img class="footer_social_media" src="../assets/footer_icons/instagram.png" alt="Footer Instagram Icon">
            </a>
            <a href="https://www.youtube.com" target="_blank">
                <img class="footer_social_media" src="../assets/footer_icons/youtube.png" alt="Footer Youtube Icon">
            </a>
            <a href="https://www.facebook.com" target="_blank">
                <img class="footer_social_media" src="../assets/footer_icons/facebook.png" alt="Footer Facebook Icon">
            </a>
            <a href="https://www.tiktok.com" target="_blank">
                <img class="footer_social_media" src="../assets/footer_icons/tiktok.png" alt="Footer Tiktok Icon">
            </a>
            <a href="https://twitter.com" target="_blank">
                <img class="footer_social_media" src="../assets/footer_icons/X.png" alt="Footer X Icon">
            </a>

            <p id="footer_text">
                © 2026 Aisle Nine. Created by Stepan Pelc. All rights reserved.
            </p>

            <div id="footer_email">
                <p>
                    Contact Us: <span id="footer_email_link">info@aislenine.com</span>
                </p>
                <a href="mailto:info@aislenine.com">
                    <img id="footer_email_icon" src="../assets/footer_icons/email.png" alt="Footer Email Icon">
                </a>
            </div>

        </footer>
    </body>
    
</html>
